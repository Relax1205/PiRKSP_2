server:
  port: ${SERVER_PORT:8091}
  shutdown: graceful

spring:
  application:
    name: order-service
  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

# Искусственная задержка ответа: имитирует обращение к БД и показывает,
# что Delivery Service не блокирует поток, пока ждёт Order Service.
orders:
  response-delay: ${ORDER_RESPONSE_DELAY:300ms}
